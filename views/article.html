<%- include('header.html') %>
<div class="site-wrap">
    <h1 class="ui h1">文章</h1>
    <div class="post-list">
        <% posts.forEach(function(post){ %>
        <a class="post-item" href="/article/<%= post.id %>">
            <% if (post.cover) { %>
            <img class="post-item-cover" src="<%= post.cover %>" alt="<%= post.title %>" />
            <% } %>
            <div class="post-item-body">
                <div class="post-item-title"><%= post.title %></div>
                <div class="post-item-summary"><%- post.summary %></div>
            </div>
        </a>
        <% }); %>
    </div>
    <%- include('pager.html') %>
</div>

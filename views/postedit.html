<%- include('adminheader.html') %>

<div class="card form-card">
    <h1>编辑文章</h1>
    <p class="subtitle">修改后点击保存即可生效；封面可替换（不传则保留原图）</p>
    <form action="/post/edit_do/" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" value="<%= id %>"/>
        <input type="hidden" name="cover" value="<%= cover %>"/>
        <div class="form-row">
            <label>标题</label>
            <input type="text" name="title" class="control" placeholder="文章标题" value="<%= title %>" required/>
        </div>
        <div class="form-row">
            <label>简介</label>
            <input type="text" name="summary" class="control" placeholder="一句话简介" value="<%= summary %>"/>
        </div>
        <div class="form-row">
            <label>封面图</label>
            <div class="cover-edit-row">
                <% if (cover) { %>
                <div class="cover-thumb"><img src="<%= cover %>" alt="当前封面"/></div>
                <% } else { %>
                <div class="cover-thumb cover-thumb-empty">暂无封面</div>
                <% } %>
                <div class="cover-edit-controls">
                    <input type="file" name="cover" accept="image/*" class="control cover-input"/>
                    <div class="cover-preview-box" id="cover-preview-box" hidden>
                        <img id="cover-preview-src" src="" alt="新封面预览"/>
                        <span>新封面预览</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-row">
            <label>正文</label>
            <script id="container" name="content" type="text/plain"><%- content %></script>
            <script type="text/javascript" src="/static/ueditor/ueditor.config.js"></script>
            <script type="text/javascript" src="/static/ueditor/ueditor.all.js"></script>
            <script type="text/javascript">
                window.UEDITOR_HOME_URL = "/ueditor/ue/";
                var ue = UE.getEditor('container', { initialFrameHeight: 500 });
            </script>
        </div>
        <button class="btn" type="submit">保存修改</button>
    </form>
</div>

</main>
<script>
// 新封面实时预览（编辑页：原图缩略 + 新图预览）
(function(){
  var input = document.querySelector('input[name=cover]');
  var box = document.getElementById('cover-preview-box');
  var img = document.getElementById('cover-preview-src');
  input.addEventListener('change', function(){
    if (this.files[0]) {
      img.src = URL.createObjectURL(this.files[0]);
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  });
})();
</script>
</body>
</html>

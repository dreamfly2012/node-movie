<%- include('adminheader.html') %>

<div class="card form-card">
    <h1>编辑分类</h1>
    <p class="subtitle">修改分类名称</p>
    <form action="/category/edit_do/" method="post">
        <input type="hidden" name="id" value="<%= id %>"/>
        <div class="form-row">
            <label>分类名</label>
            <input type="text" name="name" class="control" placeholder="分类名" value="<%= name %>" required/>
        </div>
        <button class="btn" type="submit">保存修改</button>
    </form>
</div>

</main>
</body>
</html>
